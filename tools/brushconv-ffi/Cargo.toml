[package]
name = "brushconv-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The brush converter's UniFFI surface: what the Android converter app calls, and what any other host could"

[lib]
name = "brushconv_ffi"
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
brushconv = { path = "../brushconv" }
thiserror = { workspace = true }
# The exact version: the Kotlin bindings are generated by the same release (android/bindgen, sharing
# this lock file) and refuse to load against another one.
uniffi = { version = "=0.32.2", default-features = false }
